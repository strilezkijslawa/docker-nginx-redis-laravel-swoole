; Laravel scheduler – runs `schedule:run` every minute via a bash loop.
; This avoids needing a real cron daemon inside the container.
[program:scheduler]
command=/bin/bash -c "while true; do php /var/www/html/artisan schedule:run --no-interaction && sleep 60; done"

autostart=true
autorestart=true
startsecs=5
startretries=3

user=laravel
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
