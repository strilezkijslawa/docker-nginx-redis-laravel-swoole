; ─── OPcache (critical for Octane performance) ────────────────────────────────
; Set OPCACHE_ENABLE=0 in dev: Swoole forks workers from master, so master's
; cached bytecode is inherited even after octane:reload. Disabling OPcache
; makes reload work correctly. Use OPCACHE_ENABLE=1 in production.
opcache.enable=${OPCACHE_ENABLE}
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1
; Required for Swoole coroutines
opcache.enable_file_override=0

; ─── Swoole ───────────────────────────────────────────────────────────────────
swoole.use_shortname=Off

; ─── Limits ───────────────────────────────────────────────────────────────────
memory_limit=512M
upload_max_filesize=64M
post_max_size=64M
max_execution_time=60
max_input_time=60
default_socket_timeout=60

; ─── Error handling ───────────────────────────────────────────────────────────
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2

; ─── Session (use Redis via Laravel, not PHP native) ──────────────────────────
session.gc_maxlifetime=7200

; ─── Date ─────────────────────────────────────────────────────────────────────
date.timezone=UTC

; ─── Realpath cache (helps with file resolution speed) ───────────────────────
realpath_cache_size=4096K
realpath_cache_ttl=600
