server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    charset utf-8;

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ─── Static file cache ────────────────────────────────────────────────────
    location ~* \.(ico|css|js|gif|jpg|jpeg|png|svg|woff|woff2|ttf|eot|otf|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ─── Health check (served by Swoole, not nginx) ───────────────────────────
    location = /up {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://app:8000;
        proxy_pass $upstream/up;
    }

    # ─── Main routing: static files first, then Octane ────────────────────────
    location / {
        try_files $uri @octane;
    }

    # ─── Octane (Swoole) proxy ────────────────────────────────────────────────
    location @octane {
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket support (for Laravel Reverb, Echo, etc.)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        proxy_buffering    off;

        # Use Docker's internal DNS so nginx re-resolves 'app' after container
        # restarts instead of caching the IP from startup.
        resolver 127.0.0.11 valid=10s;
        set $upstream http://app:8000;
        proxy_pass $upstream;
    }

    # ─── Block hidden files ───────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
