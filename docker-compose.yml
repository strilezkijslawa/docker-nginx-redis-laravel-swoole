services:

  # ─── Nginx (reverse proxy + static file serving) ──────────────────────────
  nginx:
    image: nginx:1.28.2-alpine3.23
    container_name: ${COMPOSE_PROJECT_NAME:-app}_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./www:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_network

  # ─── App (Laravel Octane + Swoole HTTP server) ────────────────────────────
  app:
    build:
      # Context is the project root so Docker can access both ./www (app code)
      # and ./docker/app/ (Dockerfile helpers like start.sh) in one build.
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-app}_app
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      OCTANE_SERVER: swoole
      OCTANE_WORKERS: ${OCTANE_WORKERS:-4}
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
      LOG_CHANNEL: ${LOG_CHANNEL:-daily}
      DEBUGBAR_ENABLED: ${DEBUGBAR_ENABLED:-true}
      OPCACHE_ENABLE: ${OPCACHE_ENABLE:-1}
    volumes:
      - ./www:/var/www/html
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/up"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 6

  # ─── CLI (Supervisor: queue workers + scheduler) ──────────────────────────
  cli:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-app}_cli
    user: root
    restart: unless-stopped
    entrypoint: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: ${LOG_CHANNEL:-daily}
      DEBUGBAR_ENABLED: ${DEBUGBAR_ENABLED:-true}
    volumes:
      - ./www:/var/www/html
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./docker/cli/supervisord.conf:/etc/supervisor/supervisord.conf:ro
      - ./docker/cli/conf.d:/etc/supervisor/conf.d:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
      - supervisor_logs:/var/log/supervisor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine3.21
    container_name: ${COMPOSE_PROJECT_NAME:-app}_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"${REDIS_PASSWORD:-}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── MySQL ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-app}_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# ─── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  redis_data:
  app_storage:
  app_cache:
  supervisor_logs:
  nginx_logs:

# ─── Networks ───────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge
